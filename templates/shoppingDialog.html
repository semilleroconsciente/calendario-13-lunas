<dialog id="shoppingDialog">
    <form method="dialog">
      <div class="dlg-actions su-d2d053">
        <h3 class="su-ee0cfe">🛒 Lista de compras</h3>
        <button type="button" id="shoppingCloseTop" class="btn btn-icon" title="Cerrar" aria-label="Cerrar">✕</button>
      </div>
      <p class="muted su-77e2fe">Organiza por categorías. Todo <b>local</b> por usuario. Se puede generar desde 🥗 Comidas.</p>
      <div class="conv-row">
        <label class="su-4b3de7">Producto <input type="text" id="shopName" placeholder="ej: Tomates, Pan, Avena" maxlength="40"></label>
        <label>Cant. <input type="text" id="shopQty" placeholder="1 kg" maxlength="20" class="su-581be4"></label>
        <label>Categoría
          <select id="shopCat">
            <option value="Verduras">Verduras</option>
            <option value="Frutas">Frutas</option>
            <option value="Abarrotes">Abarrotes</option>
            <option value="Proteínas">Proteínas</option>
            <option value="Lácteos">Lácteos</option>
            <option value="Panadería">Panadería</option>
            <option value="Otros">Otros</option>
          </select>
        </label>
        <button type="button" id="shopAdd" class="btn btn-accent su-4ed52d">+ Agregar</button>
      </div>
      <div id="shoppingListBox" class="shopping-list"></div>
      <div class="dlg-actions su-2d7d27">
        <span id="shoppingStats" class="muted su-6cb285"></span>
        <span class="su-a76d59">
          <button type="button" id="shoppingClearDone" class="btn su-30e741">✓ Limpiar comprados</button>
          <button type="button" id="shoppingClearAll" class="btn su-214f75">🗑 Vaciar</button>
        </span>
      </div>
      <div class="dlg-actions"><button type="button" id="shoppingClose" class="btn">Cerrar</button></div>
    </form>
  </dialog>
