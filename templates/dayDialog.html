<dialog id="dayDialog" aria-labelledby="dlgTitle" aria-modal="true">
    <form method="dialog">
      <div class="dlg-actions" style="justify-content:space-between;margin-bottom:10px">
        <h3 id="dlgTitle" style="margin:0">Día</h3>
        <button type="button" id="dlgCloseTop" class="btn btn-icon" title="Cerrar" aria-label="Cerrar">✕</button>
      </div>
      <p id="dlgDate" class="muted"></p>
      <label class="dlg-horas-label">💬 Frase del día</label>
      <blockquote id="dlgQuote" class="dlg-quote"></blockquote>
      <div id="dlgSunMoon" class="dlg-sunmoon"></div>
      <div id="dlgHorasBox" class="dlg-horas-box">
        <label class="dlg-horas-label" for="fNota">📝 Notas del día</label>
        <textarea id="fNota" rows="4" placeholder="tareas, ánimo, registros... (los sueños van en 💭 Diario Sueños)"></textarea>
        <div style="height:12px"></div>
        <label class="dlg-horas-label">🕐 Compromisos</label>
        <p class="muted" style="font-size:11px;margin:2px 0 8px">Agrega compromisos a cualquier hora exacta (ej 08:37, 14:05). Activa 🔔 para recibir notificación a esa hora y minuto.</p>
        <div id="dlgHorasGrid" class="dlg-horas-grid"></div>
        <div class="dlg-horas-add">
          <input type="time" id="dlgHourSel" aria-label="Hora (cualquiera, ej 08:37)" value="08:00" step="60" style="max-width:110px">
          <input type="text" id="dlgHourText" placeholder="Compromiso / actividad..." maxlength="80">
          <label class="check-row" style="margin:0;white-space:nowrap" title="Activar notificación a esa hora"><input type="checkbox" id="dlgHourNotify"> 🔔</label>
          <button type="button" id="dlgHourAdd" class="btn btn-accent" style="width:auto">+ Agregar</button>
        </div>
      </div>
      <div id="dlgHabits" class="dlg-habits"></div>
      <label class="dlg-horas-label">😊 Estado de ánimo</label>
      <div class="dlg-mood" id="dlgMood"></div>
      <div class="dlg-actions" style="justify-content:space-between">
        <button type="button" id="dlgMenstrual" class="btn" style="width:auto" title="Marcar o quitar este día como inicio de ciclo menstrual">🌸 Marcar inicio ciclo</button>
        <span style="display:flex;gap:10px">
          <button type="button" id="dlgShare" class="btn">📤 Compartir</button>
          <button type="button" id="dlgCancel" class="btn">Cancelar</button>
          <button type="button" id="dlgSave" class="btn btn-accent">Guardar día</button>
        </span>
      </div>
    </form>
  </dialog>
