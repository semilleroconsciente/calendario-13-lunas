name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # SHA-pin: evita tag-flotante comprometido (Shai-Hulud 2025).
      # checkout v4.2.2 / setup-node v4.4.0 — para subir, cambiar SHA+tag juntos.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1c6612b6a5060d1d888 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm test
      - name: audit gate (bloquea high/critical nuevos)
        run: npm audit --audit-level=high

  lighthouse:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    continue-on-error: true # informativo hasta calibrar umbral en runner real
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1c6612b6a5060d1d888 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: node scripts/lighthouse-ci.cjs --preset=mobile --min=0.6 --exigir
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: ${{ runner.temp }}/cal13-lh-*/lh.json
          if-no-files-found: ignore

  release:
    runs-on: windows-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1c6612b6a5060d1d888 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Publica artefacto que activa electron-updater: requiere tag firmado.
      # Se recomienda firma de artefactos / attestación GitHub en paso siguiente.
      - run: npm run build:win-nsis -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # El NSIS publicado activa electron-updater en clientes (main.js).
