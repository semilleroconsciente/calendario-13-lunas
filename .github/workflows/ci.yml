name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm test

  lighthouse:
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true # informativo hasta calibrar umbral en runner real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: node scripts/lighthouse-ci.cjs --preset=mobile --min=0.6 --exigir
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: ${{ runner.temp }}/cal13-lh-*/lh.json
          if-no-files-found: ignore

  release:
    runs-on: windows-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:win-nsis -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # El NSIS publicado activa electron-updater en clientes (main.js).
