<dialog id="convertDialog">
    <form method="dialog">
      <div class="dlg-actions su-d2d053">
        <h3 class="su-ee0cfe">📏 Conversión de unidades</h3>
        <button type="button" id="convertCloseTop" class="btn btn-icon" title="Cerrar" aria-label="Cerrar">✕</button>
      </div>
      <p class="muted">Convierte longitud, peso, volumen, temperatura, superficie, tiempo, velocidad, energía, potencia, presión, datos y ángulo. Útil para cocina, huerta, obra y estudios.</p>
      <div class="conv-grid">
        <label>Categoría
          <select id="convCat"></select>
        </label>
        <div class="conv-row">
          <label>Valor <input type="number" id="convVal" value="1" step="any"></label>
          <label>De <select id="convFrom"></select></label>
          <label>A <select id="convTo"></select></label>
        </div>
        <div id="convResult" class="conv-result">—</div>
        <button type="button" id="convSwap" class="btn">⇄ Intercambiar</button>
      </div>
      <div id="convTable" class="conv-table"></div>
      <div class="dlg-actions"><button type="button" id="convertClose" class="btn">Cerrar</button></div>
    </form>
  </dialog>
