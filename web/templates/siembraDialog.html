<dialog id="siembraDialog">
    <form method="dialog">
      <div class="dlg-actions" style="justify-content:space-between;margin-bottom:10px">
        <h3 style="margin:0">🌱 Siembra &amp; Cosecha — Penco</h3>
        <button type="button" id="siembraCloseTop" class="btn btn-icon" title="Cerrar" aria-label="Cerrar">✕</button>
      </div>
        <p class="muted">Guía por lunas: <b>luna actual + 2 siguientes</b> con siembra, cosecha y plagas. <span style="color:var(--gold)">Nuevo: 🤝 Asociaciones · 🧪 Preparados · 🌱 Semillero</span></p>
         <div class="timer-tabs" style="margin-bottom:10px;flex-wrap:wrap">
            <button type="button" id="tabSiembra" class="btn btn-accent" style="width:auto">🌱 Siembra</button>
            <button type="button" id="tabCosecha" class="btn" style="width:auto">🌾 Cosecha &amp; Plagas</button>
            <button type="button" id="tabAsociaciones" class="btn" style="width:auto">🤝 Asociaciones</button>
            <button type="button" id="tabPreparados" class="btn" style="width:auto">🧪 Preparados</button>
            <button type="button" id="tabSemillas" class="btn" style="width:auto">🌱 Semillero</button>
          </div>
          <div id="siembraTresBox" class="hidden" style="display:none"></div>
         <div id="siembraContent"></div>
         <div id="siembraHarvestBox"></div>
         <div id="siembraAsociacionesBox" class="hidden"></div>
         <div id="siembraPreparadosBox" class="hidden"></div>
         <div id="siembraSemillasBox" class="hidden"></div>
      <div class="dlg-actions"><button type="button" id="siembraClose" class="btn">Cerrar</button></div>
    </form>
  </dialog>
