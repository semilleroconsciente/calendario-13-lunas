<dialog id="englishDialog">
    <form method="dialog">
      <div class="dlg-actions" style="justify-content:space-between;margin-bottom:10px">
        <h3 style="margin:0;color:var(--accent)">Ingles</h3>
        <button type="button" id="englishCloseTop" class="btn btn-icon" title="Cerrar" aria-label="Cerrar">✕</button>
      </div>
      <p class="muted" style="line-height:1.5">Aprende inglés por <b>niveles CEFR (A1 → C1) y offline</b>, como el Kimün Mapuzugun: 1 palabra/frase al día + gramática + quiz. Toca 🔊 para escuchar (voz del dispositivo, en-US). Todo se guarda <b>local y privado</b> por usuario.</p>
      <div id="englishStreakBox" class="menstrual-card" style="border-color:var(--gold)"></div>
      <div class="timer-tabs" style="margin:12px 0 10px;flex-wrap:wrap">
        <button type="button" id="tabEN1" class="btn btn-accent" style="width:auto">☀️ Word of the day</button>
        <button type="button" id="tabEN2" class="btn" style="width:auto">🌱 A1 Principiante</button>
        <button type="button" id="tabEN3" class="btn" style="width:auto">🌿 A2 Básico</button>
        <button type="button" id="tabEN4" class="btn" style="width:auto">💬 B1 Intermedio</button>
        <button type="button" id="tabEN5" class="btn" style="width:auto">📜 B2–C1 Avanzado</button>
        <button type="button" id="tabEN6" class="btn" style="width:auto">🧩 Quiz</button>
      </div>
      <div id="englishPanel"></div>
      <div class="dlg-actions"><button type="button" id="englishClose" class="btn">Cerrar</button></div>
    </form>
  </dialog>
