<dialog id="userDialog">
    <form method="dialog">
      <h3>Nuevo usuario</h3>
      <p class="muted">Cada usuario tiene sus propias notas, mareas y reflexiones.</p>
      <label>Nombre
        <input type="text" id="fUserName" maxlength="30" placeholder="ej: Mamá, Papá...">
      </label>
      <div class="dlg-actions">
        <button type="button" id="userCancel" class="btn">Cancelar</button>
        <button type="button" id="userSave" class="btn btn-accent">Crear usuario</button>
      </div>
    </form>
  </dialog>
