<dialog id="scheduleDialog">
    <form method="dialog">
      <div class="dlg-actions" style="justify-content:space-between;margin-bottom:10px">
        <h3 style="margin:0;color:var(--accent)">📚 Horario de Clases / Estudio</h3>
        <button type="button" id="scheduleCloseTop" class="btn btn-icon" title="Cerrar" aria-label="Cerrar">✕</button>
      </div>
      <p class="muted" style="line-height:1.5">Organiza tu semana por bloques. Queda <b>privado y local</b> por usuario. Se muestra “Hoy tienes” en la portada.</p>
      <div class="conv-row">
        <label style="flex:2">Asignatura <input type="text" id="schedSubject" placeholder="ej: Matemáticas, Historia, Yoga" maxlength="40"></label>
        <label>Día
          <select id="schedDay">
            <option value="1">Lunes</option><option value="2">Martes</option><option value="3">Miércoles</option><option value="4">Jueves</option><option value="5">Viernes</option><option value="6">Sábado</option><option value="0">Domingo</option>
          </select>
        </label>
      </div>
      <div class="conv-row">
        <label>Inicio <input type="time" id="schedStart" value="08:00"></label>
        <label>Fin <input type="time" id="schedEnd" value="09:30"></label>
        <label>Color <input type="color" id="schedColor" value="#e8c56a" style="height:36px;padding:2px;width:60px"></label>
      </div>
      <div class="conv-row">
        <label>Lugar / Sala <input type="text" id="schedPlace" placeholder="ej: Sala 3, Online, Biblioteca" maxlength="30"></label>
        <button type="button" id="schedAdd" class="btn btn-accent" style="width:auto;align-self:flex-end">+ Agregar</button>
        <button type="button" id="schedUpdate" class="btn hidden" style="width:auto;align-self:flex-end">↻ Actualizar</button>
        <button type="button" id="schedCancel" class="btn hidden" style="width:auto;align-self:flex-end">Cancelar</button>
      </div>
      <div id="scheduleTodayBox" class="menstrual-card" style="margin-top:10px"></div>
      <div id="scheduleWeekGrid" class="schedule-week"></div>
      <div id="scheduleList" class="habits-list" style="margin-top:10px"></div>
      <div class="dlg-actions"><button type="button" id="scheduleClose" class="btn">Cerrar</button></div>
    </form>
  </dialog>
