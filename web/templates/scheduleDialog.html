<dialog id="scheduleDialog">
    <form method="dialog">
      <div class="dlg-actions su-d2d053">
        <h3 class="su-ee0cfe">📚 Horario de Clases / Estudio</h3>
        <button type="button" id="scheduleCloseTop" class="btn btn-icon" title="Cerrar" aria-label="Cerrar">✕</button>
      </div>
      <p class="muted su-77e2fe">Organiza tu semana por bloques. Queda <b>privado y local</b> por usuario. Se muestra “Hoy tienes” en la portada.</p>
      <div class="conv-row">
        <label class="su-4b3de7">Asignatura <input type="text" id="schedSubject" placeholder="ej: Matemáticas, Historia, Yoga" maxlength="40"></label>
        <label>Día
          <select id="schedDay">
            <option value="1">Lunes</option><option value="2">Martes</option><option value="3">Miércoles</option><option value="4">Jueves</option><option value="5">Viernes</option><option value="6">Sábado</option><option value="0">Domingo</option>
          </select>
        </label>
      </div>
      <div class="conv-row">
        <label>Inicio <input type="time" id="schedStart" value="08:00"></label>
        <label>Fin <input type="time" id="schedEnd" value="09:30"></label>
        <label>Color <input type="color" id="schedColor" value="#e8c56a" class="su-ac97bc"></label>
      </div>
      <div class="conv-row">
        <label>Lugar / Sala <input type="text" id="schedPlace" placeholder="ej: Sala 3, Online, Biblioteca" maxlength="30"></label>
        <button type="button" id="schedAdd" class="btn btn-accent su-4ed52d">+ Agregar</button>
        <button type="button" id="schedUpdate" class="btn hidden su-4ed52d">↻ Actualizar</button>
        <button type="button" id="schedCancel" class="btn hidden su-4ed52d">Cancelar</button>
      </div>
      <div id="scheduleTodayBox" class="menstrual-card su-d2c171"></div>
      <div id="scheduleWeekGrid" class="schedule-week"></div>
      <div id="scheduleList" class="habits-list su-d2c171"></div>
      <div class="dlg-actions"><button type="button" id="scheduleClose" class="btn">Cerrar</button></div>
    </form>
  </dialog>
