<dialog id="ekadashiDialog">
    <form method="dialog">
      <div class="dlg-actions" style="justify-content:space-between;margin-bottom:10px">
        <h3 style="margin:0;color:var(--accent)">📿 Ekadashi — ayuno lunar</h3>
        <button type="button" id="ekadashiCloseTop" class="btn btn-icon" title="Cerrar" aria-label="Cerrar">✕</button>
      </div>
      <p class="muted">Dos veces por mes lunar, el día 11 de la quincena clara y oscura. Tradición de ayuno y claridad para cuerpo y mente.</p>
      <div id="ekadashiIntro" style="font-size:13px;color:var(--text);line-height:1.55;margin-bottom:12px"></div>
      <div id="ekadashiList"></div>
      <div class="dlg-actions" style="justify-content:space-between;align-items:center">
        <span id="ekadashiHint" class="muted" style="margin:0;font-size:12px"></span>
        <button type="button" id="ekadashiClose" class="btn">Cerrar</button>
      </div>
    </form>
  </dialog>
