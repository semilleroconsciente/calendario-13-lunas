<dialog id="nutriDialog">
    <form method="dialog">
      <div class="dlg-actions" style="justify-content:space-between;margin-bottom:10px">
        <h3 style="margin:0;color:var(--accent)">🥗 Nutrición — comer bien en Penco</h3>
        <button type="button" id="nutriCloseTop" class="btn btn-icon" title="Cerrar" aria-label="Cerrar">✕</button>
      </div>
      <p class="muted" style="line-height:1.5">Guía educativa basada en las Guías Alimentarias de Chile (MINSAL). No es diagnóstico: si tienes diabetes, hipertensión, embarazo o desnutrición, pide hora con nutricionista en tu CESFAM.</p>
      <div class="timer-tabs" style="margin-bottom:10px;flex-wrap:wrap">
        <button type="button" data-nutri-tab="quees" class="btn btn-accent" style="width:auto;font-size:11px">📖 Qué es</button>
        <button type="button" data-nutri-tab="guia" class="btn" style="width:auto;font-size:11px">🍽️ Guía básica</button>
        <button type="button" data-nutri-tab="historia" class="btn" style="width:auto;font-size:11px">📜 Historia</button>
        <button type="button" data-nutri-tab="penco" class="btn" style="width:auto;font-size:11px">🧺 En Penco</button>
        <button type="button" data-nutri-tab="semana" class="btn" style="width:auto;font-size:11px">✅ Mi semana</button>
      </div>
      <div id="nutriBox"></div>
      <div class="dlg-actions" style="justify-content:flex-end;margin-top:10px">
        <button type="button" id="nutriClose" class="btn">Cerrar</button>
      </div>
    </form>
  </dialog>
